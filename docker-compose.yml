services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bookqna:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${BOOKQNA_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    # Optional: copy .env.example to `.env` beside this file for overrides (git-ignored). Same keys as app/.env.
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-huggingface}"
      HF_EMBEDDING_MODEL: "${HF_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
      GEMINI_EMBEDDING_MODEL: "${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-5}"
      EMBEDDING_BATCH_SLEEP_SECONDS: "${EMBEDDING_BATCH_SLEEP_SECONDS:-5.0}"
      EMBEDDING_MAX_RETRIES: "${EMBEDDING_MAX_RETRIES:-6}"
      EMBEDDING_BACKOFF_BASE_SECONDS: "${EMBEDDING_BACKOFF_BASE_SECONDS:-3.0}"
      GEMINI_CHAT_MIN_INTERVAL_SECONDS: "${GEMINI_CHAT_MIN_INTERVAL_SECONDS:-0}"
      GEMINI_CHAT_MAX_RETRIES: "${GEMINI_CHAT_MAX_RETRIES:-6}"
      VECTORSTORE_COLLECTION_PREFIX: "${VECTORSTORE_COLLECTION_PREFIX:-books}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FILE_MAX_BYTES: "${LOG_FILE_MAX_BYTES:-2097152}"
      LOG_FILE_BACKUP_COUNT: "${LOG_FILE_BACKUP_COUNT:-5}"
      LOG_DEBUG_SNIPPET_CHARS: "${LOG_DEBUG_SNIPPET_CHARS:-280}"
      RETRIEVAL_MODE: "${RETRIEVAL_MODE:-hybrid}"
      RETRIEVAL_FETCH_K: "${RETRIEVAL_FETCH_K:-40}"
      LEXICAL_MAX_DOCS: "${LEXICAL_MAX_DOCS:-5000}"
      HYBRID_RRF_K: "${HYBRID_RRF_K:-60}"
      HYBRID_DENSE_WEIGHT: "${HYBRID_DENSE_WEIGHT:-0.7}"
      HYBRID_LEXICAL_WEIGHT: "${HYBRID_LEXICAL_WEIGHT:-1.0}"
      RETRIEVAL_TRACE_MAX_ITEMS: "${RETRIEVAL_TRACE_MAX_ITEMS:-30}"
      ENABLE_LEXICAL_RETRIEVAL: "${ENABLE_LEXICAL_RETRIEVAL:-false}"
      LEXICAL_INDEX_VERSION: "${LEXICAL_INDEX_VERSION:-2}"
      RERANKER_ENABLED: "${RERANKER_ENABLED:-false}"
      RERANKER_PROVIDER: "${RERANKER_PROVIDER:-cross_encoder}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-base}"
      RERANKER_TOP_N: "${RERANKER_TOP_N:-8}"
      QUERY_DEBUG_ENABLED: "${QUERY_DEBUG_ENABLED:-false}"
      QUERY_DEBUG_CONTEXT_CHARS: "${QUERY_DEBUG_CONTEXT_CHARS:-1800}"
      MAX_HISTORY_TURNS: "${MAX_HISTORY_TURNS:-4}"
      MAX_HISTORY_CHARS: "${MAX_HISTORY_CHARS:-1400}"
      ENABLE_QUERY_REFORMULATION: "${ENABLE_QUERY_REFORMULATION:-true}"
      ENABLE_QUERY_PLANNER: "${ENABLE_QUERY_PLANNER:-false}"
      QUERY_PLANNER_ENABLE_GATING: "${QUERY_PLANNER_ENABLE_GATING:-true}"
      QUERY_PLANNER_FORCE_IN_DEBUG: "${QUERY_PLANNER_FORCE_IN_DEBUG:-false}"
      QUERY_PLANNER_MODEL: "${QUERY_PLANNER_MODEL:-gemini-2.5-flash}"
      QUERY_PLANNER_MAX_ALT_QUERIES: "${QUERY_PLANNER_MAX_ALT_QUERIES:-2}"
      QUERY_PLANNER_MAX_KEYWORDS: "${QUERY_PLANNER_MAX_KEYWORDS:-6}"
      QUERY_PLANNER_USE_BOOK_METADATA: "${QUERY_PLANNER_USE_BOOK_METADATA:-true}"
      QUERY_PLANNER_LOW_TEMP: "${QUERY_PLANNER_LOW_TEMP:-0}"
      QUERY_PLANNER_SHORT_QUERY_WORDS: "${QUERY_PLANNER_SHORT_QUERY_WORDS:-3}"
      CONTEXT_MAX_CHARS: "${CONTEXT_MAX_CHARS:-32000}"
      INCLUDE_PARENT_CONTEXT: "${INCLUDE_PARENT_CONTEXT:-true}"
      PROMPT_VERSION: "${PROMPT_VERSION:-1}"
      APP_ENV: "${APP_ENV:-local}"
      APP_VERSION: "${APP_VERSION:-dev}"
      ENABLE_LANGSMITH: "${ENABLE_LANGSMITH:-false}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-bookqna-rag}"
      LANGSMITH_TRACE_FULL_CONTEXT: "${LANGSMITH_TRACE_FULL_CONTEXT:-false}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGCHAIN_API_KEY: "${LANGCHAIN_API_KEY:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      ENABLE_RETRIEVAL_CACHE: "${ENABLE_RETRIEVAL_CACHE:-false}"
      ENABLE_GENERATION_CACHE: "${ENABLE_GENERATION_CACHE:-false}"
      RETRIEVAL_CACHE_TTL_SECONDS: "${RETRIEVAL_CACHE_TTL_SECONDS:-300}"
      GENERATION_CACHE_TTL_SECONDS: "${GENERATION_CACHE_TTL_SECONDS:-86400}"
      CACHE_CONFIG_VERSION: "${CACHE_CONFIG_VERSION:-v1}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
